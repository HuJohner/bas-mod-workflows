name: Build Mod

on:
  workflow_call:
    inputs:
      solution_path:
        description: 'Path to VS Solution (relative to repo root)'
        type: string
        required: false
      assets_path:
        description: 'Path to Assets folder (relative to repo root)'
        type: string
        default: 'Assets'
        required: false
      catalogs_path:
        description: 'Path to Catalogs folder (relative to repo root)'
        type: string
        default: 'Catalog'
        required: false
      build_windows:
        description: 'Build the Windows target'
        type: boolean
        default: true
        required: false
      build_android:
        description: 'Build the Android target'
        type: boolean
        default: false
        required: false
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_USERNAME:
        required: true
      UNITY_PASSWORD:
        required: true

env:
  BASSDK_PATH: BasSDK
  UNITY_VERSION: '2021.3.38f1'

jobs:
  build-dlls:
    name: Build DLLs
    if: ${{ inputs.solution_path != '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Detect available configurations and build
        shell: pwsh
        run: |
          $sln = "${{ inputs.solution_path }}"
          if (-not (Test-Path $sln)) {
            throw "Solution file not found: $sln"
          }

          # Extract unique configuration names from the .sln
          $content = Get-Content $sln -Raw
          $configs = [regex]::Matches($content, '^\s*(\w+)\|[^=]+ = \1\|', 'Multiline') |
                     ForEach-Object { $_.Groups[1].Value } |
                     Select-Object -Unique

          if ($configs.Count -eq 0) {
            throw "No configurations found in solution"
          }

          Write-Host "Available configurations: $($configs -join ', ')"

          $firstConfig = $configs[0]
          Write-Host "Fallback (first) configuration: $firstConfig"

          function Get-PreferredConfig([string]$preferred) {
            $match = $configs | Where-Object { $_ -ieq $preferred } | Select-Object -First 1
            if ($match) {
              Write-Host "Using preferred configuration: $match"
              return $match
            }
            Write-Host "Preferred '$preferred' not found → falling back to '$firstConfig'"
            return $firstConfig
          }

          # ---------- Windows ----------
          if ("${{ inputs.build_windows }}" -eq "true") {
            $winConfig = Get-PreferredConfig "Windows"
            # Also accept common aliases
            if ($winConfig -eq $firstConfig) {
              $alias = $configs | Where-Object { $_ -match '^(Debug|Release|Windows)$' } | Select-Object -First 1
              if ($alias) { $winConfig = $alias }
            }

            Write-Host "Building Windows with Configuration=$winConfig"
            msbuild $sln `
              /p:Configuration=$winConfig `
              /p:OutputPath=bin\Windows\ `
              /v:minimal
          }

          # ---------- Android ----------
          if ("${{ inputs.build_android }}" -eq "true") {
            $androidConfig = Get-PreferredConfig "Android"

            Write-Host "Building Android with Configuration=$androidConfig"
            msbuild $sln `
              /p:Configuration=$androidConfig `
              /p:OutputPath=bin\Android\ `
              /v:minimal
          }

      - name: Upload DLL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-dlls
          path: |
            bin/Windows/**
            bin/Android/**
          if-no-files-found: error
  build-addressables:
    name: Build (${{ matrix.target.name }})
    if: ${{ inputs.assets_path != '' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Windows
            method: CIBuildAddressables.BuildWindows
            build_target: StandaloneWindows64
            artifact: mod-windows
          - name: Android
            method: CIBuildAddressables.BuildAndroid
            build_target: Android
            artifact: mod-android
        exclude:
          # Exclude Windows when build_windows is false
          - target:
              name: ${{ inputs.build_windows && 'dummy' || 'Windows' }}
          # Exclude Android when build_android is false
          - target:
              name: ${{ inputs.build_android && 'dummy' || 'Android' }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the shared workflow repo so we can access scripts/
      # -----------------------------------------------------------------------
      - name: Checkout workflow repo (for CI scripts)
        uses: actions/checkout@v4
        with:
          repository: HuJohner/bas-mod-workflows
          path: bas-mod-workflows

      # -----------------------------------------------------------------------
      # 2. Check out the calling mod repo
      # -----------------------------------------------------------------------
      - name: Checkout mod repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: mod

      # -----------------------------------------------------------------------
      # 3. Restore cached BasSDK clone (avoids ~2 min clone + full reimport)
      # -----------------------------------------------------------------------
      - name: Cache BasSDK
        id: cache-bassdk
        uses: actions/cache@v4
        with:
          path: ${{ env.BASSDK_PATH }}
          key: BasSDK-${{ env.UNITY_VERSION }}-${{ matrix.target.name }}
          # No restore-keys — BasSDK cache must be exact version match

      # -----------------------------------------------------------------------
      # 4. Clone BasSDK if cache miss (avoids ~2 min clone + full reimport)
      # -----------------------------------------------------------------------
      - name: Clone BasSDK
        if: steps.cache-bassdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 \
            https://dev.azure.com/Warpfrog/BasSDK/_git/BasSDK \
            ${{ env.BASSDK_PATH }}

      # -----------------------------------------------------------------------
      # 5. Link mod assets + inject CI script into BasSDK
      #    Uses a *relative* symlink (not junction, not absolute symlink):
      #    junctions and absolute symlinks bake in a host path that becomes
      #    invalid once unity-builder's Docker container remaps this
      #    workspace to c:/github/workspace. A relative symlink resolves
      #    relative to its own directory, so it survives the remap since
      #    BasSDK and mod are both under the same mounted root.
      # -----------------------------------------------------------------------
      - name: Set up project structure
        shell: bash
        run: |
          MOD_NAME="${{ github.event.repository.name }}"
          PERSONAL_DIR="${{ env.BASSDK_PATH }}/Assets/Personal"
          EDITOR_DIR="${{ env.BASSDK_PATH }}/Assets/Editor"

          mkdir -p "$PERSONAL_DIR"
          # Remove stale link from a previous cached run
          rm -rf "$PERSONAL_DIR/$MOD_NAME"
          cmd //c mklink //D "$(cygpath -w "$PERSONAL_DIR/$MOD_NAME")" "..\..\..\mod\${{ inputs.assets_path }}"
          echo "Linked mod assets -> $PERSONAL_DIR/$MOD_NAME"

          mkdir -p "$EDITOR_DIR"
          cp bas-mod-workflows/scripts/CIBuildAddressables.cs "$EDITOR_DIR/CIBuildAddressables.cs"
          echo "Injected CIBuildAddressables.cs into $EDITOR_DIR"

      # -----------------------------------------------------------------------
      # 6. Restore cached Unity Library (avoids full reimport on cache hit)
      #    Must happen BEFORE Unity starts, so it doesn't reimport everything
      # -----------------------------------------------------------------------
      - name: Cache Unity Library
        id: cache-library
        uses: actions/cache@v4
        with:
          path: ${{ env.BASSDK_PATH }}/Library
          key: Library-${{ matrix.target.name }}-${{ env.UNITY_VERSION }}-${{ hashFiles('mod/**') }}
          restore-keys: |
            Library-${{ matrix.target.name }}-${{ env.UNITY_VERSION }}-
            Library-${{ matrix.target.name }}-

      # -----------------------------------------------------------------------
      # 7. Build addressables
      # -----------------------------------------------------------------------
      - name: Build addressables (${{ matrix.target.name }})
        id: build-addressables
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.BASSDK_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.target.build_target }}
          buildMethod: ${{ matrix.target.method }}
          allowDirtyBuild: true
          customParameters: -desiredWorkerCount 1 -standbyWorkerCount 1

      # -----------------------------------------------------------------------
      # 8. Upload build output as artifacts
      # -----------------------------------------------------------------------
      - name: Upload artifacts (${{ matrix.target.name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: |
            ${{ env.BASSDK_PATH }}/BuildStaging/AddressableAssets/${{ matrix.target.name == 'Android' && 'Android' || 'Windows' }}/**
          if-no-files-found: error
          retention-days: 30