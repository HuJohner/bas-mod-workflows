name: Build Mod

on:
  workflow_call:
    inputs:
      assets_path:
        description: 'Path to Assets folder (relative to repo root)'
        type: string
        default: 'Assets'
        required: false
      catalogs_path:
        description: 'Path to Catalogs folder (relative to repo root)'
        type: string
        default: 'Catalog'
        required: false
      build_windows:
        description: 'Build the Windows target'
        type: boolean
        default: true
        required: false
      build_android:
        description: 'Build the Android target'
        type: boolean
        default: false
        required: false
    secrets:
      UNITY_LICENSE:
        required: true
      UNITY_USERNAME:
        required: true
      UNITY_PASSWORD:
        required: true

env:
  BASSDK_PATH: BasSDK
  UNITY_VERSION: '2021.3.38f1'

jobs:
  build-addressables:
    name: Build (${{ matrix.target.name }})
    if: ${{ inputs.assets_path != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: Windows
            method: CIBuildAddressables.BuildWindows
            build_target: StandaloneWindows64
            artifact: mod-windows
          - name: Android
            method: CIBuildAddressables.BuildAndroid
            build_target: Android
            artifact: mod-android
        exclude:
          # Exclude Windows when build_windows is false
          - target:
              name: ${{ inputs.build_windows && 'dummy' || 'Windows' }}
          # Exclude Android when build_android is false
          - target:
              name: ${{ inputs.build_android && 'dummy' || 'Android' }}

    steps:
      # -----------------------------------------------------------------------
      # 1. Check out the shared workflow repo so we can access scripts/
      # -----------------------------------------------------------------------
      - name: Checkout workflow repo (for CI scripts)
        uses: actions/checkout@v4
        with:
          repository: HuJohner/bas-mod-workflows
          path: bas-mod-workflows

      # -----------------------------------------------------------------------
      # 2. Check out the calling mod repo
      # -----------------------------------------------------------------------
      - name: Checkout mod repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          path: mod

      # -----------------------------------------------------------------------
      # 3. Restore cached BasSDK clone (avoids ~2 min clone + full reimport)
      # -----------------------------------------------------------------------
      - name: Cache BasSDK
        id: cache-bassdk
        uses: actions/cache@v4
        with:
          path: ${{ env.BASSDK_PATH }}
          key: BasSDK-${{ env.UNITY_VERSION }}-${{ matrix.target.name }}
          # No restore-keys — BasSDK cache must be exact version match

      # -----------------------------------------------------------------------
      # 4. Clone BasSDK if cache miss (avoids ~2 min clone + full reimport)
      # -----------------------------------------------------------------------
      - name: Clone BasSDK
        if: steps.cache-bassdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 \
            https://dev.azure.com/Warpfrog/BasSDK/_git/BasSDK \
            ${{ env.BASSDK_PATH }}

      # -----------------------------------------------------------------------
      # 5. Link mod assets + inject CI script into BasSDK
      #    Uses a *relative* symlink (not junction, not absolute symlink):
      #    junctions and absolute symlinks bake in a host path that becomes
      #    invalid once unity-builder's Docker container remaps this
      #    workspace to c:/github/workspace. A relative symlink resolves
      #    relative to its own directory, so it survives the remap since
      #    BasSDK and mod are both under the same mounted root.
      # -----------------------------------------------------------------------
      - name: Link mod assets
        uses: HuJohner/bas-mod-workflows/.github/actions/relative-symlink@main
        with:
          path: ${{ env.BASSDK_PATH }}/Assets/Personal/${{ github.event.repository.name }}
          target: ../../../mod/${{ inputs.assets_path }}

      - name: Inject CI script
        shell: bash
        run: |
          mkdir -p "${{ env.BASSDK_PATH }}/Assets/Editor"
          cp bas-mod-workflows/scripts/CIBuildAddressables.cs "${{ env.BASSDK_PATH }}/Assets/Editor/CIBuildAddressables.cs"

      - name: Link catalogs
        uses: HuJohner/bas-mod-workflows/.github/actions/relative-symlink@main
        with:
          path: ${{ env.BASSDK_PATH }}/BuildStaging/Catalogs/CI
          target: ../../../mod/${{ inputs.catalogs_path }}

      # -----------------------------------------------------------------------
      # 6. Restore cached Unity Library (avoids full reimport on cache hit)
      #    Must happen BEFORE Unity starts, so it doesn't reimport everything
      # -----------------------------------------------------------------------
      - name: Cache Unity Library
        id: cache-library
        uses: actions/cache@v4
        with:
          path: ${{ env.BASSDK_PATH }}/Library
          key: Library-${{ matrix.target.name }}-${{ env.UNITY_VERSION }}-${{ hashFiles('mod/**') }}
          restore-keys: |
            Library-${{ matrix.target.name }}-${{ env.UNITY_VERSION }}-
            Library-${{ matrix.target.name }}-

      - name: Free disk space
        if: ${{ runner.os == 'Linux' }}
        uses: jlumbroso/free-disk-space@v1.3.1

      # -----------------------------------------------------------------------
      # 7. Build addressables
      # -----------------------------------------------------------------------
      - name: Build addressables (${{ matrix.target.name }})
        id: build-addressables
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.BASSDK_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.target.build_target }}
          buildMethod: ${{ matrix.target.method }}
          allowDirtyBuild: true
          customParameters: -desiredWorkerCount 1 -standbyWorkerCount 1

      # -----------------------------------------------------------------------
      # 8. Upload build output as artifacts
      # -----------------------------------------------------------------------
      - name: Upload artifacts (${{ matrix.target.name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.artifact }}
          path: |
            ${{ env.BASSDK_PATH }}/BuildStaging/AddressableAssets/${{ matrix.target.name == 'Android' && 'Android' || 'Windows' }}/**
          if-no-files-found: error
          retention-days: 30