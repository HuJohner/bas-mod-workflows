name: 'Relative Symlink'
description: >
  Links a directory into place. On Windows, uses `mklink /D` (a directory
  symlink is fully transparent to the Windows Editor's asset import).
  On Linux, uses a bind mount instead of `ln -s` — Unity's Asset Database V2
  on the Linux Editor does not reliably track directory symlinks (it can
  throw "does not exist in SourceAssetDB" errors and trigger an infinite
  reimport loop); a bind mount presents as a real directory, avoiding this
  entirely. Ensures the parent directory exists and removes/unmounts
  anything already at `path` first.

inputs:
  path:
    description: 'Path where the linked directory should appear'
    required: true
  target:
    description: 'Path to link/mount, relative to the parent directory of `path`'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Link directory
      shell: bash
      run: |
        set -e

        LINK_PATH="${{ inputs.path }}"
        TARGET_PATH="${{ inputs.target }}"

        PARENT_DIR="$(dirname "$LINK_PATH")"
        LINK_NAME="$(basename "$LINK_PATH")"

        mkdir -p "$PARENT_DIR"
        cd "$PARENT_DIR"

        if [ "$RUNNER_OS" = "Windows" ]; then
          rm -rf "$LINK_NAME"
          cmd //c mklink //D "$LINK_NAME" "$TARGET_PATH"
          echo "Linked $PARENT_DIR/$LINK_NAME -> $TARGET_PATH (mklink)"
        else
          # If a previous run left a bind mount active, unmount it first.
          if mountpoint -q "$LINK_NAME" 2>/dev/null; then
            sudo umount "$LINK_NAME"
          fi
          rm -rf "$LINK_NAME"

          ABS_TARGET="$(realpath -m "$TARGET_PATH")"
          mkdir -p "$LINK_NAME"
          sudo mount --bind "$ABS_TARGET" "$LINK_NAME"
          echo "Bind-mounted $PARENT_DIR/$LINK_NAME -> $ABS_TARGET"
        fi